<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for display -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Glowing background ambient ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8"/>

  <!-- Architectural Isometric Pipeline Geometry -->
  <g transform="translate(0, -10)">
    <!-- Bottom Layer (Cyan - Destination Sync) -->
    <path d="M 128 320 L 256 384 L 384 320 L 256 256 Z" fill="url(#cyanGrad)" opacity="0.35"/>
    <path d="M 128 320 L 128 338 L 256 402 L 256 384 Z" fill="#0369a1" opacity="0.4"/>
    <path d="M 256 384 L 256 402 L 384 338 L 384 320 Z" fill="#0284c7" opacity="0.4"/>

    <!-- Middle Layer (Emerald Pipeline Flow) -->
    <path d="M 128 250 L 256 314 L 384 250 L 256 186 Z" fill="url(#emeraldGrad)" opacity="0.85" filter="url(#glow)"/>
    <path d="M 128 250 L 128 268 L 256 332 L 256 314 Z" fill="#047857"/>
    <path d="M 256 314 L 256 332 L 384 268 L 384 250 Z" fill="#059669"/>

    <!-- Top Cap (High-Throughput Ingestion Node) -->
    <path d="M 160 170 L 256 218 L 352 170 L 256 122 Z" fill="#f8fafc"/>
    <path d="M 160 170 L 160 182 L 256 230 L 256 218 Z" fill="#cbd5e1"/>
    <path d="M 256 218 L 256 230 L 352 182 L 352 170 Z" fill="#e2e8f0"/>

    <!-- Dynamic Flow Pipeline Particles -->
    <circle cx="256" cy="170" r="16" fill="url(#goldGrad)"/>
    <path d="M 256 160 L 256 180 M 246 170 L 266 170" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Connection Nodes -->
    <circle cx="160" cy="250" r="10" fill="#38bdf8"/>
    <circle cx="384" cy="250" r="10" fill="#34d399"/>
  </g>

  <!-- Brand Typography Subtitle -->
  <text x="256" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#10b981" text-anchor="middle">STACKPIPELINE</text>
</svg>
